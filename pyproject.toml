[project]
name = "local-image-search"
version = "0.3.0"
description = "MCP server for local image search using SigLIP embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "daft>=0.7.2",
    "huggingface-hub>=0.36.0",
    "mcp>=1.0.0",
    "numpy>=2.2.0",
    "pillow>=10.0.0",
    "pillow-heif>=0.18.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.128.0",
    "matplotlib>=3.10.8",
    "uvicorn>=0.40.0",
]

[project.scripts]
local-image-search = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server", "core", "embed"]
